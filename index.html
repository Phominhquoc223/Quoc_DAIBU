<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thông tin sinh viên</title>
<style>
  :root {
    --bg: #f3f6fb;
    --side: #1f3a5f;
    --side-hover: #2a4d7e;
    --text: #1b2430;
    --card: #ffffff;
    --accent: #e0a526;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
  }
  .sidebar {
    width: 280px;
    background: var(--side);
    padding: 32px 20px;
    flex-shrink: 0;
  }
  .user {
    width: 100%;
    background: transparent;
    border: 1px solid rgba(255,255,255,.25);
    border-radius: 8px;
    padding: 16px;
    text-align: left;
    color: #fff;
    cursor: pointer;
    font: inherit;
    transition: background .2s;
  }
  .user:hover, .user:focus-visible { background: var(--side-hover); outline: 2px solid var(--accent); outline-offset: 2px; }
  .user.active { background: var(--side-hover); border-color: var(--accent); }
  .user .name { font-size: 18px; font-weight: 700; }
  .user .mssv { margin-top: 6px; font-size: 14px; opacity: .85; }
  .content {
    flex: 1;
    padding: 40px;
    display: flex;
    align-items: flex-start;
  }
  .hint { color: #6b7686; }
  .info {
    display: none;
    background: var(--card);
    border-left: 5px solid var(--accent);
    border-radius: 8px;
    padding: 24px 28px;
    box-shadow: 0 2px 10px rgba(0,0,0,.08);
    max-width: 520px;
  }
  .info.show { display: block; animation: appear .25s ease; }
  .info h2 { margin-bottom: 14px; font-size: 20px; }
  .info p { margin: 8px 0; line-height: 1.5; }
  @keyframes appear { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .info.show { animation: none; } }
  @media (max-width: 640px) {
    body { flex-direction: column; }
    .sidebar { width: 100%; padding: 20px; }
    .content { padding: 20px; }
  }
</style>
</head>
<body>

  <aside class="sidebar">
    <button class="user" id="userBtn" type="button" aria-controls="info" aria-expanded="false">
      <div class="name">Phó Minh Quốc Knul</div>
      <div class="mssv">MSSV: PK04952</div>
    </button>
  </aside>

  <main class="content">
    <p class="hint" id="hint">Nhấn vào tên bên trái để xem thông tin người dùng.</p>
    <section class="info" id="info">
      <h2>Thông tin người dùng</h2>
      <p><strong>Họ và tên:</strong> Phó Minh Quốc Knul</p>
      <p><strong>MSSV:</strong> PK04952</p>
      <p><strong>Học môn:</strong> CNTT ngành lập trình web.</p>
    </section>
  </main>

<script>
  const btn = document.getElementById('userBtn');
  const info = document.getElementById('info');
  const hint = document.getElementById('hint');

  btn.addEventListener('click', () => {
    const open = info.classList.toggle('show');
    btn.classList.toggle('active', open);
    btn.setAttribute('aria-expanded', open);
    hint.style.display = open ? 'none' : 'block';
  });
</script>
</body>
</html>
